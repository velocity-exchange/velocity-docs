name: Secret scan

# Caller for the org's shared TruffleHog scan. All logic lives in
# velocity-exchange/shared-workflows - keep this file thin so every repo's
# caller stays interchangeable and there is exactly one place to tune.
#
# Scans this PR's own commits (merge-base..head) and fails only on credentials
# that verify live against their issuing provider. Candidates that cannot be
# verified, and possible Solana keypairs, are annotated but never blocking.

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    uses: velocity-exchange/shared-workflows/.github/workflows/secret-scan-reusable.yml@master
    with:
      # This repo runs on ubuntu-latest, not the ubicloud-standard-8 the
      # reusable workflow defaults to.
      runner: ubuntu-latest
