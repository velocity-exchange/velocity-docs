name: New dependency gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write # v2 deletes a stale label through the issues API

jobs:
  new-dependency-gate:
    name: New dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # required: the action diffs against the base commit
      - uses: velocity-exchange/shared-workflows/dependency-gate@59625d7f7ee3bd49faa47a0a85978509ec57ab1f # dependency-gate-v2.0.1
        with:
          lockfiles: bun.lock
          require-pull-request-target: true
