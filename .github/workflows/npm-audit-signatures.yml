name: npm audit signatures

# Verifies registry signatures (and, where publishers provide them, provenance
# attestations) for the dependency tree this repo actually installs.
#
# `npm audit signatures` is npm-only, but it reads node_modules rather than a
# lockfile, so it can verify a pnpm-installed tree directly. That matters: an
# `npm install` here re-resolves from the package.json ranges and audits
# whatever npm prefers today (925 packages when measured) instead of what
# pnpm-lock.yaml pins (892). Only the second set ever ships.
#
# Non-blocking to start (continue-on-error: true): flip that off once one run
# has passed in CI, so this becomes an enforced gate rather than noise that
# gets ignored.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  audit-signatures:
    name: npm audit signatures
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # package.json pins pnpm by version and sha512, so corepack verifies the
      # package manager itself before using it.
      - name: Enable corepack
        run: corepack enable

      # --node-linker=hoisted lays the same locked versions out as real
      # directories instead of symlinks into .pnpm. npm needs that here: reading
      # the default symlinked layout, it pairs the alias directory name
      # (@coral-xyz/anchor) with the aliased version (1.0.1) and aborts with
      # ETARGET, because that name and version pair exists nowhere. The hoisted
      # layout exposes the package's real name, so the alias resolves. This
      # changes the layout only, never which versions are installed.
      - name: Install the locked tree with pnpm
        run: pnpm install --frozen-lockfile --ignore-scripts --node-linker=hoisted

      - name: Verify registry signatures and provenance
        run: npm audit signatures
