name: npm audit signatures

# Verifies registry signatures (and, where publishers provide them, provenance
# attestations) for the dependency tree this repo actually installs.
#
# `npm audit signatures` is npm-only, but it reads node_modules rather than a
# lockfile, so it can verify the tree installed by Bun directly. Do not replace
# this with `npm install`: that re-resolves from the package.json ranges and
# audits whatever npm prefers today instead of what bun.lock pins. Only the
# locked tree ever ships.
#
# npm reads node_modules by directory name, so an aliased dependency has to
# expose its real package name on disk or npm pairs the alias directory
# (@coral-xyz/anchor) with the aliased version (1.0.1) and aborts with ETARGET,
# because that name and version pair exists nowhere. Bun's default layout
# writes the real name, so the alias resolves with no extra flags. pnpm needed
# --node-linker=hoisted here for the same reason.
#
# Non-blocking to start (continue-on-error: true): flip that off once one run
# has passed in CI, so this becomes an enforced gate rather than noise that
# gets ignored.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  audit-signatures:
    name: npm audit signatures
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Install the locked tree with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify registry signatures and provenance
        run: npm audit signatures
